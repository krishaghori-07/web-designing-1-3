<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        /*unvisisted link*/
        a:link{
            color:blue;
        }
        /*visited link*/
        a:visited{
            color:purple;
        }
        /*mouse over link*/
        a:hover{
            color:green;
            font-size:25px;
        }
        /*clicked hover*/
        a:active{
            color:red;
        }

    </style>
</head>
<body>
    <h1>css link pseudo class</h1>
    <a href="https://www.google.com/?zx=1792220750081">Google</a>
    <br><br>
    <a href="https://www.youtube.com/">Youtube</a>
</body>
</html>
